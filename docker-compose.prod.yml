services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nicole-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - nicole-network
    healthcheck:
      test: curl -f http://localhost:3001/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: nicole-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - nicole-network

networks:
  nicole-network:
    driver: bridge
