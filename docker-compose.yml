services:
  mongo:
    image: mongo:7.0
    container_name: nicole-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-Nicole2024!}
    networks:
      - nicole-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: nicole-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-Nicole2024!}@mongo:27017/nicole-trend-shop?authSource=admin
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - nicole-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: nicole-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - nicole-network

volumes:
  mongo-data:

networks:
  nicole-network:
    driver: bridge
