services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server.dev
    container_name: nicole-server
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: nicole-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
