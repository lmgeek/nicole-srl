version: '3.8'

services:
  server:
    volumes:
      - ./server:/app/server
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    environment:
      - NODE_ENV=development
    command: ["npx", "nodemon", "server/index.js"]

  frontend:
    image: node:22-alpine
    container_name: nicole-frontend-dev
    ports:
      - "80:80"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:3001
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 80"]
